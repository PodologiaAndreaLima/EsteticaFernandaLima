spring.application.name=esteticaFernandaLima

#Swagger
springdoc.swagger-ui.enabled=true

server.error.include-message=always
server.error.include-binding-errors=always
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

#JWT
# garantir que o Hibernate crie o schema antes do data.sql
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.validity=3600000
jwt.secret=RXhpc3RlIHVtYSB0ZW9yaWEgcXVlIGRpeiBxdWUsIHNlIHVtIGRpYSBhbGd16W0gZGVzY29icmlyIGV4YXRhbWVudGUgcGFyYSBxdWUgc2VydmUgbyBVbml2Z

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/esteticafernandalima?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:@BD2419#lol09}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# opcional: se quiser manter o dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Integracao com microservico de ordem de servico
ordemservico.ms.base-url=${ORDEMSERVICO_MS_BASE_URL:http://localhost:8081}
ordemservico.ms.timeout-ms=5000

# Geracao de mensagens por IA (desabilitada por padrao; nunca exponha a chave ao frontend)
mensagens.ai.enabled=${MESSAGENS_AI_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout-ms=${OPENAI_TIMEOUT_MS:10000}

# Provedor de envio:
#   whatsapp-link (padrao) = envio manual: o backend devolve o link wa.me e o app abre o WhatsApp
#   fake = simulacao para testes | http = gateway real de mensagens
mensagens.provider=${MESSAGENS_PROVIDER:whatsapp-link}
mensagens.fake-provider.fail=${MESSAGENS_FAKE_PROVIDER_FAIL:false}
mensagens.provider.url=${MESSAGENS_PROVIDER_URL:}
mensagens.provider.token=${MESSAGENS_PROVIDER_TOKEN:}
mensagens.provider.timeout-ms=${MESSAGENS_PROVIDER_TIMEOUT_MS:10000}
