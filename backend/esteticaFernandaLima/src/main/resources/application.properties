spring.application.name=esteticaFernandaLima

#Swagger
springdoc.swagger-ui.enabled=true

server.error.include-message=always
server.error.include-binding-errors=always
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

#JWT
# garantir que o Hibernate crie o schema antes do data.sql
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.validity=3600000
jwt.secret=${JWT_SECRET}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/esteticafernandalima?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:sua_senha}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# opcional: se quiser manter o dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Integracao com microservico de ordem de servico
ordemservico.ms.base-url=${ORDEMSERVICO_MS_BASE_URL:http://localhost:8081}
ordemservico.ms.timeout-ms=5000

# Geracao de mensagens por IA (desabilitada por padrao; nunca exponha a chave ao frontend)
mensagens.ai.enabled=${MESSAGENS_AI_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout-ms=${OPENAI_TIMEOUT_MS:10000}
# 0 = mais previsivel | 2 = mais criativo (0.7 varia o texto no "Gerar outra mensagem" sem fugir das regras)
openai.temperature=${OPENAI_TEMPERATURE:0.7}
# Nome que a IA usa para identificar quem esta escrevendo
mensagens.clinica.nome=${CLINICA_NOME:Fernanda Lima Beauty Care}

# Provedor de envio:
#   whatsapp-link (padrao) = envio manual: o backend devolve o link wa.me e o app abre o WhatsApp
#   fake = simulacao para testes | http = gateway real de mensagens
mensagens.provider=${MESSAGENS_PROVIDER:whatsapp-link}
mensagens.fake-provider.fail=${MESSAGENS_FAKE_PROVIDER_FAIL:false}
mensagens.provider.url=${MESSAGENS_PROVIDER_URL:}
mensagens.provider.token=${MESSAGENS_PROVIDER_TOKEN:}
mensagens.provider.timeout-ms=${MESSAGENS_PROVIDER_TIMEOUT_MS:10000}

# Nota ETL: GEMINI_API_KEY e JWT_SECRET fornecidos apenas pelo ambiente/secret store.
# Configurar GEMINI_MODEL com identificador de modelo aprovado no ambiente.
nota.gemini.modelo=${GEMINI_MODEL}
nota.gemini.timeout=30s
nota.imagem.max-bytes=5242880
spring.servlet.multipart.max-file-size=5242880B
spring.servlet.multipart.max-request-size=5500000B
nota.imagem.max-pixels=12000000
nota.imagem.diretorio-privado=${NOTA_PRIVATE_DIR}
# Imagem privada somente em PROCESSANDO/EM_REVISAO; excluir nos estados terminais.
# Falha de exclusao deve permanecer pendente e auditavel; nao declarar expurgo bem-sucedido.
# Nao armazenar JSON bruto; manter somente hash e dados estruturados de auditoria.
nota.validacao.tolerancia-total=0.02
nota.worker.concorrencia=2
nota.worker.max-tentativas=3
nota.worker.lease=60s
nota.rate-limit.requisicoes-por-minuto=30
nota.rate-limit.uploads-por-minuto=5
