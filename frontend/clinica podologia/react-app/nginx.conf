upstream backend_cluster {
    server 10.0.0.201:8080 weight=1 max_fails=3 fail_timeout=30s;
    server 10.0.0.171:8080 weight=1 max_fails=3 fail_timeout=30s;
}

upstream ordem_servico_ms {
    server 10.0.0.201:8081 weight=1 max_fails=3 fail_timeout=30s;
    server 10.0.0.171:8081 weight=1 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(usuarios|cliente|funcionarios|servico-produto|custo-fixo|custo-extra|custos-extras|custos-fixos|combo|dash-simples|dash-detalhada|swagger-ui|v3|api-docs) {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ ^/(ordens-servico|dashboard) {
        proxy_pass http://ordem_servico_ms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|json|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    server_tokens off;
    client_max_body_size 10M;
}